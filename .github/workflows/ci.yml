name: CI

# Runs the test suite on every PR (and on pushes to main). Make this a
# required status check in branch protection so PRs can't merge until it
# passes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyyaml pytest ruff

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v
