[build-system]
# >=77: required by `license = "MIT"` below (PEP 639 SPDX-string form). The
# older `license = {text = ...}` table form works on a lower floor, but
# setuptools has announced its removal (2027-02-18) — the SPDX string is the
# only currently non-deprecated option, so this floor isn't optional strictness.
# It costs nothing here: every install path in this repo (make/CI/install.sh)
# uses default build isolation, which always resolves current setuptools
# regardless of the declared floor.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "b64-k8s-secrets-tool"
# Released versions are cut from git tags by the release workflow; this static
# value is just a placeholder so the project is installable for dev/test.
version = "0.0.0"
description = "A dark-themed Tkinter GUI for working with Kubernetes secrets: encode/decode base64, build Secret YAML from a .env file, fetch existing secrets from a cluster (read-only), and seal them with kubeseal."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
# Flat single-file modules rather than a package.
py-modules = ["app", "core"]

[tool.ruff.lint]
# The codebase deliberately uses `stmt; return` one-liners for terse UI
# callbacks, so E702 (multiple statements on one line) is disabled; the rest
# of ruff's default checks (pyflakes F-rules, pycodestyle E/W) apply.
ignore = ["E702"]
